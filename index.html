<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ff0033">
  <title>YouTube 앱으로 이동</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #111827;
      --muted: #667085;
      --line: #e5e7eb;
      --youtube: #ff0033;
      --youtube-dark: #d9002b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));
    }

    .card {
      width: min(100%, 420px);
      padding: 28px 22px 22px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.10);
      text-align: center;
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: var(--youtube);
      box-shadow: 0 14px 30px rgba(255, 0, 51, 0.22);
    }

    .logo svg {
      width: 52px;
      height: 52px;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.04em;
      font-weight: 950;
    }

    .status {
      min-height: 48px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      font-weight: 800;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .actions {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .button {
      min-height: 56px;
      padding: 0 16px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 950;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .button.primary {
      color: #fff;
      background: var(--youtube);
      border: 1px solid var(--youtube);
    }

    .button.primary:active { background: var(--youtube-dark); }

    .button.secondary {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .note {
      margin: 16px 0 0;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.6;
      font-weight: 750;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="pageTitle">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" role="img">
        <rect x="3" y="12" width="58" height="40" rx="14" fill="#fff"></rect>
        <path d="M27 23.5 44 32 27 40.5Z" fill="#ff0033"></path>
      </svg>
    </div>

    <h1 id="pageTitle">YouTube 앱으로 이동 중입니다</h1>
    <p class="status" id="statusText" aria-live="polite">잠시만 기다려 주세요.</p>

    <div class="actions">
      <a class="button primary" id="openAppButton" href="#">YouTube 앱으로 열기</a>
      <a class="button secondary" id="returnShopButton" href="https://www.ssa-u.com/">싸U 쇼핑몰로 돌아가기</a>
      <a class="button secondary" id="openWebButton" href="#">웹에서 계속 보기</a>
    </div>

    <p class="note">
      기기 또는 카카오톡 정책에 따라 자동 이동이 막히면<br>
      ‘YouTube 앱으로 열기’를 한 번 눌러 주세요.
    </p>
  </main>

  <script>
    (() => {
      'use strict';

      // 실제 YouTube 목적지는 이 한 줄만 수정하면 됩니다.
      const YOUTUBE_WEB_URL =
        'https://www.youtube.com/channel/UCRLKyHLgvgjH18_eBBAZeQQ/live';

      const youtubeTargetUrl = new URL(YOUTUBE_WEB_URL);
      const YOUTUBE_HOST_AND_PATH =
        youtubeTargetUrl.host +
        youtubeTargetUrl.pathname +
        youtubeTargetUrl.search;

      // YouTube iOS 앱의 관행적 커스텀 스킴입니다.
      // 실패하면 아래의 HTTPS 주소로 자동 복귀합니다.
      const YOUTUBE_IOS_APP_URL =
        'youtube://' + YOUTUBE_HOST_AND_PATH;

      const YOUTUBE_ANDROID_INTENT_URL =
        'intent://' + YOUTUBE_HOST_AND_PATH +
        '#Intent;' +
        'scheme=https;' +
        'package=com.google.android.youtube;' +
        'action=android.intent.action.VIEW;' +
        'category=android.intent.category.BROWSABLE;' +
        'S.browser_fallback_url=' + encodeURIComponent(YOUTUBE_WEB_URL) + ';' +
        'end';

      const ua = String(navigator.userAgent || '');
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isKakaoTalk = /KAKAOTALK/i.test(ua);
      const isMobile = isAndroid || isIOS;

      const SHOP_HOME_URL = 'https://www.ssa-u.com/';
      const params = new URLSearchParams(window.location.search);
      const externalMode = params.get('external') === '1';

      function resolveSafeReturnUrl_(value) {
        const rawReturnUrl = String(value || '').trim();
        if (!rawReturnUrl) return SHOP_HOME_URL;

        try {
          const candidate = new URL(rawReturnUrl);
          const isAllowed =
            candidate.protocol === 'https:' &&
            candidate.hostname.toLowerCase() === 'www.ssa-u.com' &&
            !candidate.port &&
            !candidate.username &&
            !candidate.password;
          return isAllowed ? candidate.href : SHOP_HOME_URL;
        } catch (_error) {
          return SHOP_HOME_URL;
        }
      }

      const safeReturnUrl = resolveSafeReturnUrl_(params.get('returnUrl'));
      const statusText = document.getElementById('statusText');
      const openAppButton = document.getElementById('openAppButton');
      const returnShopButton = document.getElementById('returnShopButton');
      const openWebButton = document.getElementById('openWebButton');

      let fallbackTimer = 0;
      let pageWasHidden = false;

      const AUTO_RETURN_RESUME_DELAY_MS = 220;
      const AUTO_RETURN_ARM_TIMEOUT_MS = 10000;
      const autoReturnState = {
        armed: false,
        hidden: false,
        completed: false,
        resumeTimer: 0,
        armTimer: 0
      };

      function setStatus(message) {
        if (statusText) statusText.textContent = message;
      }

      function clearFallbackTimer() {
        if (fallbackTimer) {
          window.clearTimeout(fallbackTimer);
          fallbackTimer = 0;
        }
      }

      function clearAutoReturnTimers_() {
        if (autoReturnState.resumeTimer) {
          window.clearTimeout(autoReturnState.resumeTimer);
          autoReturnState.resumeTimer = 0;
        }
        if (autoReturnState.armTimer) {
          window.clearTimeout(autoReturnState.armTimer);
          autoReturnState.armTimer = 0;
        }
      }

      function cancelAutoReturn_() {
        clearAutoReturnTimers_();
        autoReturnState.armed = false;
        autoReturnState.hidden = false;
        autoReturnState.completed = false;
      }

      function armAutoReturn_() {
        clearAutoReturnTimers_();
        autoReturnState.armed = true;
        autoReturnState.hidden = false;
        autoReturnState.completed = false;
        autoReturnState.armTimer = window.setTimeout(() => {
          autoReturnState.armTimer = 0;
          if (!autoReturnState.hidden && !autoReturnState.completed) {
            cancelAutoReturn_();
          }
        }, AUTO_RETURN_ARM_TIMEOUT_MS);
      }

      function markAutoReturnHidden_() {
        if (!autoReturnState.armed || autoReturnState.completed) return;
        clearAutoReturnTimers_();
        autoReturnState.hidden = true;
      }

      function returnToShop_() {
        clearFallbackTimer();
        clearAutoReturnTimers_();
        autoReturnState.armed = false;
        autoReturnState.hidden = false;
        autoReturnState.completed = true;
        setStatus('싸U 쇼핑몰로 돌아가는 중입니다.');

        if (externalMode) {
          window.location.replace(safeReturnUrl);
          return;
        }

        const openerUrl = window.location.href;
        try {
          window.history.back();
        } catch (_error) {
          window.location.replace(safeReturnUrl);
          return;
        }

        window.setTimeout(() => {
          if (!document.hidden && window.location.href === openerUrl) {
            window.location.replace(safeReturnUrl);
          }
        }, 700);
      }

      function maybeAutoReturnToShop_() {
        const isVisible = !document.hidden &&
          (!document.visibilityState || document.visibilityState === 'visible');
        if (
          !autoReturnState.armed ||
          !autoReturnState.hidden ||
          autoReturnState.completed ||
          !isVisible ||
          autoReturnState.resumeTimer
        ) {
          return;
        }

        autoReturnState.resumeTimer = window.setTimeout(() => {
          autoReturnState.resumeTimer = 0;
          const stillVisible = !document.hidden &&
            (!document.visibilityState || document.visibilityState === 'visible');
          if (
            !autoReturnState.armed ||
            !autoReturnState.hidden ||
            autoReturnState.completed ||
            !stillVisible
          ) {
            return;
          }
          autoReturnState.completed = true;
          autoReturnState.armed = false;
          returnToShop_();
        }, AUTO_RETURN_RESUME_DELAY_MS);
      }

      function handleVisibilityChange_() {
        if (document.hidden) {
          pageWasHidden = true;
          clearFallbackTimer();
          markAutoReturnHidden_();
          return;
        }
        maybeAutoReturnToShop_();
      }

      function handlePageHide_() {
        pageWasHidden = true;
        clearFallbackTimer();
        markAutoReturnHidden_();
      }

      function handleWindowFocus_() {
        if (!document.hidden) maybeAutoReturnToShop_();
      }

      function handleWindowBlur_() {
        // 주소창·시스템 창에서도 blur가 발생할 수 있어 자동 복귀의 hidden 확정에는 쓰지 않습니다.
        if (!isMobile) return;
        pageWasHidden = true;
        clearFallbackTimer();
      }

      document.addEventListener('visibilitychange', handleVisibilityChange_);
      window.addEventListener('pagehide', handlePageHide_);
      window.addEventListener('pageshow', maybeAutoReturnToShop_);
      window.addEventListener('focus', handleWindowFocus_);
      window.addEventListener('blur', handleWindowBlur_);

      function getAppUrl() {
        if (isAndroid) return YOUTUBE_ANDROID_INTENT_URL;
        if (isIOS) return YOUTUBE_IOS_APP_URL;
        return YOUTUBE_WEB_URL;
      }

      function buildExternalBrowserUrl() {
        const externalPageUrl = new URL(window.location.href);
        externalPageUrl.searchParams.set('external', '1');
        externalPageUrl.searchParams.set('returnUrl', safeReturnUrl);
        externalPageUrl.searchParams.set('_ts', String(Date.now()));
        return 'kakaotalk://web/openExternal?url=' +
          encodeURIComponent(externalPageUrl.toString());
      }

      function scheduleWebFallback(delayMs) {
        clearFallbackTimer();
        pageWasHidden = false;

        fallbackTimer = window.setTimeout(() => {
          fallbackTimer = 0;
          if (!pageWasHidden && !document.hidden) {
            cancelAutoReturn_();
            setStatus('앱을 열지 못해 YouTube 웹페이지로 이동합니다.');
            window.location.replace(YOUTUBE_WEB_URL);
          }
        }, Math.max(900, Number(delayMs || 1800)));
      }

      function attemptAppOpen(automatic) {
        if (!isMobile) {
          cancelAutoReturn_();
          clearFallbackTimer();
          window.location.replace(YOUTUBE_WEB_URL);
          return;
        }

        setStatus(
          automatic
            ? 'YouTube 앱을 자동으로 여는 중입니다.'
            : 'YouTube 앱을 여는 중입니다.'
        );

        armAutoReturn_();
        scheduleWebFallback(automatic ? 1800 : 2300);

        try {
          window.location.href = getAppUrl();
        } catch (_error) {
          // fallback timer가 HTTPS 주소로 이동하며 자동 복귀 대기는 해제합니다.
          cancelAutoReturn_();
        }
      }

      function attemptKakaoExternalOpen() {
        if (!isKakaoTalk || externalMode) return;

        const externalUrl = buildExternalBrowserUrl();
        openAppButton.href = externalUrl;
        setStatus('카카오톡 밖에서 YouTube 앱을 여는 중입니다.');
        armAutoReturn_();

        try {
          window.location.href = externalUrl;
        } catch (_error) {
          cancelAutoReturn_();
          // 자동 이동이 막혀도 첫 번째 버튼으로 다시 시도할 수 있습니다.
        }

        window.setTimeout(() => {
          if (!document.hidden && !pageWasHidden) {
            setStatus(
              '자동 이동이 차단되었습니다. 아래 버튼을 한 번 눌러 주세요.'
            );
          }
        }, 900);
      }

      openAppButton.href = isKakaoTalk && !externalMode
        ? buildExternalBrowserUrl()
        : getAppUrl();
      returnShopButton.href = safeReturnUrl;
      openWebButton.href = YOUTUBE_WEB_URL;

      // 실제 사용자 탭을 유지하기 위해 href 이동을 그대로 사용하고,
      // 외부 브라우저에서 앱 이동이 실패한 경우에만 HTTPS fallback을 실행합니다.
      openAppButton.addEventListener('click', () => {
        if (!isMobile) {
          cancelAutoReturn_();
          clearFallbackTimer();
          setStatus('YouTube 웹페이지로 이동합니다.');
          return;
        }

        armAutoReturn_();
        if (isKakaoTalk && !externalMode) {
          clearFallbackTimer();
          setStatus('카카오톡 밖에서 YouTube 앱을 여는 중입니다.');
          return;
        }

        setStatus('YouTube 앱을 여는 중입니다.');
        scheduleWebFallback(2300);
      });

      returnShopButton.addEventListener('click', (event) => {
        event.preventDefault();
        returnToShop_();
      });

      openWebButton.addEventListener('click', () => {
        cancelAutoReturn_();
        clearFallbackTimer();
        setStatus('YouTube 웹페이지로 이동합니다.');
      });

      if (isKakaoTalk && !externalMode) {
        attemptKakaoExternalOpen();
      } else if (isMobile) {
        // 외부 브라우저로 넘어온 경우 앱 열기를 한 번 자동 시도합니다.
        // 브라우저 정책상 차단되면 수동 버튼이 그대로 남습니다.
        window.setTimeout(() => attemptAppOpen(true), 60);
      } else {
        setStatus('YouTube 웹페이지로 이동합니다.');
        window.setTimeout(() => {
          cancelAutoReturn_();
          window.location.replace(YOUTUBE_WEB_URL);
        }, 350);
      }
    })();
  </script>
</body>
</html>
